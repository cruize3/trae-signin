name: TRAE 每日签到

on:
  schedule:
    # 每天 01:12 UTC = 09:12 北京时间
    - cron: '12 1 * * *'
  workflow_dispatch: # 支持手动触发

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 编译签到工具
        run: go build -o signin_bin ./cmd/signin

      - name: 生成凭证文件
        run: |
          mkdir -p auths
          # 账号1
          echo '${{ secrets.TRAE_AUTH_1 }}' > auths/trae-1.json
          # 账号2
          echo '${{ secrets.TRAE_AUTH_2 }}' > auths/trae-2.json
          # 如需更多账号，添加更多 TRAE_AUTH_N

      - name: 执行签到
        run: ./signin_bin auths

      - name: 清理凭证
        if: always()
        run: rm -rf auths
