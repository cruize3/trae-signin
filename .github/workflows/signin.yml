name: TRAE 每日签到

on:
  schedule:
    # 每天 01:12 UTC = 09:12 北京时间
    - cron: '12 1 * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  secrets: write  # 允许回写刷新后的凭证

jobs:
  signin:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: 编译签到工具
        run: go build -o signin_bin ./cmd/signin

      - name: 生成凭证文件
        run: |
          mkdir -p auths
          echo '${{ secrets.TRAE_AUTH_1 }}' > auths/trae-1.json
          echo '${{ secrets.TRAE_AUTH_2 }}' > auths/trae-2.json

      - name: 执行签到
        run: ./signin_bin auths

      - name: 回写刷新后的凭证到 Secrets
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 签到程序会把刷新后的 token 写回 auth 文件
          # 这里读取并更新到 GitHub Secrets，下次 CI 运行就能用新的 token
          if [ -f auths/trae-1.json ]; then
            gh secret set TRAE_AUTH_1 < auths/trae-1.json
            echo "✅ TRAE_AUTH_1 已更新"
          fi
          if [ -f auths/trae-2.json ]; then
            gh secret set TRAE_AUTH_2 < auths/trae-2.json
            echo "✅ TRAE_AUTH_2 已更新"
          fi

      - name: 清理凭证
        if: always()
        run: rm -rf auths
